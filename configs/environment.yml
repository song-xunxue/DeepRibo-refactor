# DeepRibo 重构版本 Conda 环境配置文件
#
# 使用方法:
#   conda env create -f environment.yml
#   conda activate deepribo-refactor

name: DeepRibo-refactor
channels:
  - pytorch
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python 3.12.2
  - python=3.12.2

  # PyTorch 2.0+ (支持CUDA 12.x)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - torchaudio>=2.0.0

  # CUDA支持（可选，根据GPU版本调整）
  # - pytorch>=2.0.0=*cuda*  # 如果有NVIDIA GPU
  # - pytorch>=2.0.0=*cpu*   # 如果只有CPU

  # 数据科学库
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - scikit-learn>=1.3.0

  # 生物信息学库
  - biopython>=1.80
#  - bedtools>=2.30.0 #该库没有提供给Win 艹

  # 其他工具
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - tqdm>=4.65.0
  - pyyaml>=6.0

  # 开发工具（可选）
  - black>=23.0.0        # 代码格式化
  - flake8>=6.0.0        # 代码质量检查
  - mypy>=1.5.0           # 类型检查
  - pytest>=7.4.0          # 测试框架
  - jupyter>=1.0.0         # Jupyter Notebook支持

# pip依赖（不在conda中）
# pip:
#   - tensorboard>=2.12.0
#   - wandb>=0.15.0
